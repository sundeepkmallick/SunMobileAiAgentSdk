name: Upload Maven Central staging deployment

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type UPLOAD-0.1.0-rc.2 to upload a user-managed deployment to Sonatype
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-request:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit upload confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$CONFIRMATION" = "UPLOAD-0.1.0-rc.2" || {
            echo "Confirmation must be exactly UPLOAD-0.1.0-rc.2"
            exit 1
          }

  upload-user-managed-deployment:
    needs: validate-request
    runs-on: ubuntu-latest
    environment: maven-central-staging
    env:
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
      - name: Install Android SDK platform
        run: sdkmanager --install "platforms;android-36.1" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Require all Central credentials and signing material
        run: |
          test -n "$SIGNING_KEY"
          test -n "$SIGNING_PASSWORD"
          test -n "$MAVEN_CENTRAL_USERNAME"
          test -n "$MAVEN_CENTRAL_PASSWORD"
      - name: Publish signed artifacts to the runner's local Maven repository
        run: ./gradlew --no-daemon publishSdkToMavenLocal
      - name: Verify all six coordinates, POM metadata and PGP signatures
        env:
          VERIFY_MAVEN_SIGNATURES: "true"
        run: python3 scripts/verify-maven-local.py
      - name: Build and validate Central bundle
        run: python3 scripts/prepare-central-bundle.py --bundle build/central-bundle.zip
      - name: Retain bundle for audit
        uses: actions/upload-artifact@v4
        with:
          name: maven-central-bundle-0.1.0-rc.2
          path: build/central-bundle.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload to Central Portal as user-managed deployment
        run: python3 scripts/prepare-central-bundle.py --bundle build/central-bundle.zip --upload
