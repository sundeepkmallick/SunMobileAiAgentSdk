name: CI
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:
concurrency:
  group: sdk-ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Download Gradle distribution (retry transient failures)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Checking Gradle availability (attempt $attempt of 3)"
            if ./gradlew --no-daemon --version; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Gradle bootstrap failed; retrying in 30 seconds..."
              sleep 30
            fi
          done

          echo "Unable to initialize Gradle after 3 attempts."
          exit 1
      - name: Run core unit tests
        run: ./gradlew --no-daemon :agent-core:test
  sample-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK platform
        run: sdkmanager --install "platforms;android-36.1" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Download Gradle distribution (retry transient failures)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Checking Gradle availability (attempt $attempt of 3)"
            if ./gradlew --no-daemon --version; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Gradle bootstrap failed; retrying in 30 seconds..."
              sleep 30
            fi
          done

          echo "Unable to initialize Gradle after 3 attempts."
          exit 1
      - name: Build offline Android sample
        run: ./gradlew --no-daemon :sample-app:assembleDebug :agent-adk:assembleDebug :agent-firebase:assembleDebug :agent-litertlm:assembleDebug :agent-mlkit:assembleDebug :agent-gemini-nano:assembleDebug
