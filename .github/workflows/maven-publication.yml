name: Maven publication verification

on:
  pull_request:
  push:
    branches: [main, "feature/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-and-consume-locally:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
      - name: Install Android SDK platform
        run: sdkmanager --install "platforms;android-36.1" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Publish all five modules to Maven local
        run: ./gradlew --no-daemon publishSdkToMavenLocal
      - name: Verify POMs and classified artifacts
        run: python3 scripts/verify-maven-local.py
      - name: Resolve all five artifacts from an independent Android consumer
        run: ./gradlew --no-daemon -p validation/maven-consumer :consumer:assembleDebug
