[versions]
agp = "9.5.1"
kotlin = "2.4.10"
coroutines = "1.10.2"
serialization = "1.11.0"
junit = "4.13.2"
adk = "1.0.0"
litertLm = "0.13.1"
mlkitGenaiAgent = "1.0.0-alpha1"
mlkitGenaiPrompt = "1.0.0-beta5"
firebaseBom = "34.18.0"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
junit = { module = "junit:junit", version.ref = "junit" }
google-adk-kotlin-core-android = { module = "com.google.adk:google-adk-kotlin-core-android", version.ref = "adk" }
google-adk-kotlin-firebase-android = { module = "com.google.adk:google-adk-kotlin-firebase-android", version.ref = "adk" }
google-adk-kotlin-litertlm-android = { module = "com.google.adk:google-adk-kotlin-litertlm-android", version.ref = "adk" }
google-ai-edge-litertlm-android = { module = "com.google.ai.edge.litertlm:litertlm-android", version.ref = "litertLm" }
mlkit-genai-agent = { module = "com.google.mlkit:genai-agent", version.ref = "mlkitGenaiAgent" }
mlkit-genai-prompt = { module = "com.google.mlkit:genai-prompt", version.ref = "mlkitGenaiPrompt" }
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-ai = { module = "com.google.firebase:firebase-ai" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
